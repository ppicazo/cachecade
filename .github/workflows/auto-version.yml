name: Auto Version

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  version-and-tag:
    name: Create version tag if PR is merged
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
    
    - name: Get current version
      id: current_version
      run: |
        version=$(python -c "from setuptools import setup; setup()" --version)
        echo "current_version=$version" >> $GITHUB_OUTPUT
    
    - name: Determine new version
      id: new_version
      run: |
        current=${{ steps.current_version.outputs.current_version }}
        major=$(echo $current | cut -d. -f1)
        minor=$(echo $current | cut -d. -f2)
        patch=$(echo $current | cut -d. -f3)
        new_patch=$((patch + 1))
        new_version="$major.$minor.$new_patch"
        echo "new_version=$new_version" >> $GITHUB_OUTPUT
    
    - name: Update version in setup.py
      run: |
        sed -i "s/version=\"${{ steps.current_version.outputs.current_version }}\"/version=\"${{ steps.new_version.outputs.new_version }}\"/" setup.py
    
    - name: Create tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add setup.py
        git commit -m "Bump version to ${{ steps.new_version.outputs.new_version }}"
        git tag -a "v${{ steps.new_version.outputs.new_version }}" -m "Version ${{ steps.new_version.outputs.new_version }}"
    
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main
        tags: true